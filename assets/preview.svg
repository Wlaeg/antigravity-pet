<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111B33"/>
      <stop offset="100%" stop-color="#1A1536"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="318" rx="17" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Pixel Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <path d="M0 40 H960 M0 80 H960 M0 120 H960 M0 160 H960 M0 200 H960 M0 240 H960 M0 280 H960"/>
    <path d="M80 0 V320 M160 0 V320 M240 0 V320 M320 0 V320 M400 0 V320 M480 0 V320 M560 0 V320 M640 0 V320 M720 0 V320 M800 0 V320 M880 0 V320"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="150" cy="80" r="110" fill="#38BDF8" opacity="0.08"/>
  <circle cx="820" cy="240" r="130" fill="#818CF8" opacity="0.1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M12 18 L17 11 L22 17 L27 11 L32 18 L32 30 C32 33 27 35 22 35 C17 35 12 33 12 30 Z" fill="#38BDF8"/>
    <rect x="17" y="22" width="3" height="4" rx="1" fill="#0F172A"/>
    <rect x="24" y="22" width="3" height="4" rx="1" fill="#0F172A"/>

    <text x="58" y="21" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">Antigravity Pet</text>
    <text x="58" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Native Windows Pixel Desktop Companion for Google Antigravity</text>

    <!-- Status Badge Top Right -->
    <g transform="translate(650, 4)">
      <rect x="0" y="0" width="236" height="32" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#22C55E"/>
      <text x="32" y="20" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Zero Dependencies · WPF + Hooks</text>
    </g>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(36, 98)" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="14" y="16" fill="#7DD3FC">No Taskbar / Tray</text>

    <rect x="146" y="0" width="144" height="24" rx="12" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.5"/>
    <text x="160" y="16" fill="#C7D2FE">Click Bubble -&gt; Chat</text>

    <rect x="300" y="0" width="154" height="24" rx="12" fill="#1E293B" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="314" y="16" fill="#6EE7B7">Launch &amp; Exit w/ AGY</text>

    <rect x="464" y="0" width="144" height="24" rx="12" fill="#1E293B" stroke="#F472B6" stroke-opacity="0.5"/>
    <text x="478" y="16" fill="#FBCFE8">Aux Pane Settings</text>

    <rect x="618" y="0" width="110" height="24" rx="12" fill="#1E293B" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="633" y="16" fill="#FDE68A">EN / ZH i18n</text>

    <rect x="738" y="0" width="148" height="24" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text x="752" y="16" fill="#DDD6FE">16-Dir Eye Follow</text>
  </g>

  <!-- 6 Character Cards -->
  <g transform="translate(36, 142)">
    <!-- 1. CyberFox -->
    <g transform="translate(0, 0)">
      <rect width="138" height="146" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.4"/>
      <rect x="18" y="12" width="102" height="22" rx="11" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="69" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#E0F2FE">Thinking...</text>
      <!-- Pixel Fox -->
      <g transform="translate(45, 46)">
        <rect x="6" y="0" width="8" height="8" fill="#0284C7"/>
        <rect x="34" y="0" width="8" height="8" fill="#0284C7"/>
        <rect x="6" y="8" width="36" height="24" rx="2" fill="#38BDF8"/>
        <rect x="12" y="20" width="24" height="12" fill="#F8FAFC"/>
        <rect x="12" y="14" width="6" height="6" fill="#0F172A"/>
        <rect x="30" y="14" width="6" height="6" fill="#0F172A"/>
        <rect x="10" y="32" width="28" height="18" fill="#0EA5E9"/>
        <rect x="16" y="32" width="16" height="18" fill="#E0F2FE"/>
      </g>
      <text x="69" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">CyberFox</text>
      <text x="69" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94A3B8">cyber-fox (Default)</text>
    </g>

    <!-- 2. AstroBot -->
    <g transform="translate(150, 0)">
      <rect width="138" height="146" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <rect x="18" y="12" width="102" height="22" rx="11" fill="#0F172A" stroke="#22C55E" stroke-width="1"/>
      <text x="69" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#BBF7D0">✓ Task Ready</text>
      <g transform="translate(45, 46)">
        <rect x="21" y="0" width="6" height="6" fill="#38BDF8"/>
        <rect x="8" y="6" width="32" height="26" rx="4" fill="#E2E8F0"/>
        <rect x="13" y="12" width="22" height="14" rx="2" fill="#0F172A"/>
        <rect x="17" y="16" width="5" height="5" fill="#38BDF8"/>
        <rect x="26" y="16" width="5" height="5" fill="#38BDF8"/>
        <rect x="10" y="32" width="28" height="18" fill="#CBD5E1"/>
        <rect x="18" y="36" width="12" height="8" fill="#38BDF8"/>
      </g>
      <text x="69" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">AstroBot</text>
      <text x="69" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94A3B8">astro-bot</text>
    </g>

    <!-- 3. ShadowCat -->
    <g transform="translate(300, 0)">
      <rect width="138" height="146" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <rect x="18" y="12" width="102" height="22" rx="11" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="69" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#FDE68A">! Needs Input</text>
      <g transform="translate(45, 46)">
        <rect x="6" y="2" width="8" height="8" fill="#1E293B"/>
        <rect x="34" y="2" width="8" height="8" fill="#1E293B"/>
        <rect x="6" y="10" width="36" height="22" fill="#1E293B"/>
        <rect x="12" y="16" width="6" height="6" fill="#FACC15"/>
        <rect x="30" y="16" width="6" height="6" fill="#FACC15"/>
        <rect x="10" y="32" width="28" height="18" fill="#0F172A"/>
        <rect x="18" y="36" width="12" height="6" fill="#F59E0B"/>
      </g>
      <text x="69" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">ShadowCat</text>
      <text x="69" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94A3B8">shadow-cat</text>
    </g>

    <!-- 4. ByteGhost -->
    <g transform="translate(450, 0)">
      <rect width="138" height="146" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <rect x="18" y="12" width="102" height="22" rx="11" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
      <text x="69" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#C7D2FE">Editing code...</text>
      <g transform="translate(45, 46)">
        <rect x="10" y="6" width="28" height="36" rx="6" fill="#A5B4FC"/>
        <rect x="6" y="14" width="36" height="26" fill="#818CF8"/>
        <rect x="13" y="16" width="6" height="8" fill="#0F172A"/>
        <rect x="29" y="16" width="6" height="8" fill="#0F172A"/>
        <rect x="10" y="40" width="8" height="6" fill="#818CF8"/>
        <rect x="20" y="40" width="8" height="8" fill="#818CF8"/>
        <rect x="30" y="40" width="8" height="6" fill="#818CF8"/>
      </g>
      <text x="69" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">ByteGhost</text>
      <text x="69" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94A3B8">byte-ghost</text>
    </g>

    <!-- 5. ShibaDog -->
    <g transform="translate(600, 0)">
      <rect width="138" height="146" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <rect x="18" y="12" width="102" height="22" rx="11" fill="#0F172A" stroke="#FB923C" stroke-width="1"/>
      <text x="69" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#FED7AA">Running checks</text>
      <g transform="translate(45, 46)">
        <rect x="6" y="2" width="8" height="8" fill="#D97706"/>
        <rect x="34" y="2" width="8" height="8" fill="#D97706"/>
        <rect x="6" y="10" width="36" height="22" fill="#F59E0B"/>
        <rect x="12" y="22" width="24" height="10" fill="#FEF3C7"/>
        <rect x="12" y="16" width="5" height="5" fill="#0F172A"/>
        <rect x="31" y="16" width="5" height="5" fill="#0F172A"/>
        <rect x="10" y="32" width="28" height="18" fill="#D97706"/>
        <rect x="16" y="32" width="16" height="18" fill="#FEF3C7"/>
      </g>
      <text x="69" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">ShibaDog</text>
      <text x="69" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94A3B8">shiba-dog</text>
    </g>

    <!-- 6. PixelDragon -->
    <g transform="translate(750, 0)">
      <rect width="138" height="146" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <rect x="18" y="12" width="102" height="22" rx="11" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
      <text x="69" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#FECACA">✕ Blocked</text>
      <g transform="translate(45, 46)">
        <rect x="10" y="0" width="6" height="8" fill="#FACC15"/>
        <rect x="32" y="0" width="6" height="8" fill="#FACC15"/>
        <rect x="6" y="8" width="36" height="24" fill="#10B981"/>
        <rect x="12" y="14" width="6" height="6" fill="#0F172A"/>
        <rect x="30" y="14" width="6" height="6" fill="#0F172A"/>
        <rect x="10" y="32" width="28" height="18" fill="#059669"/>
        <rect x="16" y="34" width="16" height="16" fill="#A7F3D0"/>
      </g>
      <text x="69" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">PixelDragon</text>
      <text x="69" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94A3B8">pixel-dragon</text>
    </g>
  </g>
</svg>
