<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <pattern id="pixelGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Base Canvas: Crisp Dark Slate IDE Aesthetic -->
  <rect width="960" height="420" rx="10" fill="#0B0F17"/>
  <rect width="960" height="420" rx="10" fill="url(#pixelGrid)"/>
  <rect x="1" y="1" width="958" height="418" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Accent Rule -->
  <rect x="28" y="20" width="904" height="2" fill="#1E293B"/>
  <rect x="28" y="20" width="140" height="2" fill="#38BDF8"/>

  <!-- Header -->
  <g transform="translate(28, 34)">
    <!-- Pixel Logo Icon -->
    <rect x="0" y="0" width="46" height="46" rx="4" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
    <rect x="10" y="9" width="7" height="7" fill="#0284C7"/>
    <rect x="29" y="9" width="7" height="7" fill="#0284C7"/>
    <rect x="10" y="16" width="26" height="17" fill="#38BDF8"/>
    <rect x="14" y="24" width="18" height="9" fill="#F8FAFC"/>
    <rect x="14" y="19" width="5" height="5" fill="#0F172A"/>
    <rect x="27" y="19" width="5" height="5" fill="#0F172A"/>
    <rect x="15" y="19" width="2" height="2" fill="#F8FAFC"/>
    <rect x="28" y="19" width="2" height="2" fill="#F8FAFC"/>

    <!-- Title & Version -->
    <text x="60" y="22" font-family="Consolas, 'Cascadia Mono', 'Segoe UI', monospace" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Antigravity Pet</text>
    <rect x="274" y="5" width="54" height="20" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="301" y="19" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">v4.0</text>
    <text x="60" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">Interactive Pixel Desktop Companion for Google Antigravity · Windows &amp; macOS</text>

    <!-- Right Tech Pill -->
    <g transform="translate(656, 7)">
      <rect x="0" y="0" width="248" height="30" rx="2" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <rect x="12" y="11" width="8" height="8" fill="#10B981"/>
      <text x="28" y="19" font-family="Consolas, monospace" font-size="11.5" font-weight="600" fill="#E2E8F0">C# WPF · Swift · Zero Deps</text>
    </g>
  </g>

  <!-- Middle Feature Showcase: Left (Reverse Control) + Right (Edge Dock & Fullscreen Peek) -->
  <g transform="translate(28, 98)">
    <!-- LEFT CARD: Reverse Control & Pixel Bubble Approval -->
    <rect x="0" y="0" width="444" height="164" rx="4" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="23" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">01 / REVERSE CONTROL &amp; PIXEL BUBBLE</text>

    <!-- Pixel Approval Bubble with Hard Shadow -->
    <g transform="translate(18, 36)">
      <rect x="3" y="3" width="218" height="62" rx="2" fill="#000000" opacity="0.6"/>
      <rect x="0" y="0" width="218" height="62" rx="2" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
      <text x="12" y="20" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">Approve: git push origin</text>
      <rect x="12" y="30" width="92" height="22" rx="2" fill="#10B981" stroke="#047857" stroke-width="1.5"/>
      <text x="58" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">✓ Allow</text>
      <rect x="114" y="30" width="92" height="22" rx="2" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
      <text x="160" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">✕ Deny</text>
    </g>

    <!-- CyberFox with Crown & Holographic Terminal -->
    <g transform="translate(92, 102)">
      <!-- Crown -->
      <rect x="12" y="-8" width="20" height="5" fill="#FACC15" stroke="#0F172A" stroke-width="1"/>
      <rect x="12" y="-12" width="4" height="4" fill="#FACC15"/>
      <rect x="20" y="-14" width="4" height="6" fill="#FACC15"/>
      <rect x="28" y="-12" width="4" height="4" fill="#FACC15"/>
      <rect x="21" y="-7" width="3" height="3" fill="#38BDF8"/>
      <!-- Fox -->
      <rect x="6" y="0" width="8" height="6" fill="#0284C7"/>
      <rect x="30" y="0" width="8" height="6" fill="#0284C7"/>
      <rect x="6" y="6" width="32" height="20" fill="#38BDF8"/>
      <rect x="11" y="16" width="22" height="10" fill="#F8FAFC"/>
      <rect x="11" y="10" width="5" height="5" fill="#0F172A"/>
      <rect x="28" y="10" width="5" height="5" fill="#0F172A"/>
      <rect x="9" y="26" width="26" height="18" fill="#0EA5E9"/>
      <!-- Terminal Prop -->
      <rect x="7" y="30" width="30" height="14" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
      <rect x="10" y="33" width="24" height="8" fill="#0F172A"/>
      <rect x="12" y="35" width="12" height="2" fill="#38BDF8"/>
      <rect x="12" y="38" width="8" height="2" fill="#7DD3FC"/>
    </g>

    <!-- Right Notes inside Left Card -->
    <g transform="translate(252, 46)" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#CBD5E1">
      <rect x="0" y="0" width="6" height="6" fill="#38BDF8"/>
      <text x="14" y="7" font-weight="600" fill="#F8FAFC">Double-Click Quick Dispatch</text>
      <text x="14" y="23" font-size="10.5" fill="#94A3B8">Send tasks straight to Antigravity</text>

      <rect x="0" y="40" width="6" height="6" fill="#F59E0B"/>
      <text x="14" y="47" font-weight="600" fill="#F8FAFC">PreToolUse Bubble Approval</text>
      <text x="14" y="63" font-size="10.5" fill="#94A3B8">Approve or deny high-risk commands</text>

      <rect x="0" y="80" width="6" height="6" fill="#10B981"/>
      <text x="14" y="87" font-weight="600" fill="#F8FAFC">Click Bubble -&gt; Jump to Chat</text>
      <text x="14" y="103" font-size="10.5" fill="#94A3B8">Stacked Task-State cards &amp; Pin</text>
    </g>

    <!-- RIGHT CARD: Edge Half-Body Peek, Status Block & Fullscreen Aware -->
    <rect x="460" y="0" width="444" height="164" rx="4" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="476" y="23" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#10B981">02 / EDGE PEEK, STATUS BLOCK &amp; FULLSCREEN</text>

    <!-- Mock Monitor Screen Frame -->
    <g transform="translate(476, 36)">
      <rect x="0" y="0" width="184" height="114" rx="2" fill="#0B0F17" stroke="#475569" stroke-width="1.5"/>
      <text x="12" y="18" font-family="Consolas, monospace" font-size="9.5" fill="#64748B">DISPLAY EDGE</text>
      <!-- Compact Status Color Block -->
      <rect x="128" y="33" width="34" height="14" rx="2" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
      <!-- Half-Body Peeking ShibaDog Tilted -14 deg -->
      <g transform="translate(154, 54) rotate(-14)">
        <!-- Cap -->
        <rect x="0" y="-6" width="24" height="7" fill="#0EA5E9" stroke="#0F172A" stroke-width="1"/>
        <rect x="-4" y="-1" width="18" height="3" fill="#0284C7"/>
        <!-- Shiba Half Body -->
        <rect x="2" y="1" width="28" height="22" fill="#F59E0B"/>
        <rect x="4" y="12" width="18" height="11" fill="#FEF3C7"/>
        <rect x="6" y="6" width="5" height="5" fill="#0F172A"/>
        <rect x="7" y="6" width="2" height="2" fill="#F8FAFC"/>
        <rect x="2" y="23" width="28" height="22" fill="#D97706"/>
      </g>
      <!-- Clipping Mask Line at Screen Right Edge -->
      <rect x="184" y="-2" width="46" height="118" fill="#111827"/>
      <line x1="184" y1="0" x2="184" y2="114" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3"/>
    </g>

    <!-- Right Notes inside Right Card -->
    <g transform="translate(676, 46)" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#CBD5E1">
      <rect x="0" y="0" width="6" height="6" fill="#10B981"/>
      <text x="14" y="7" font-weight="600" fill="#F8FAFC">Left / Right Half-Body Peek</text>
      <text x="14" y="23" font-size="10.5" fill="#94A3B8">Tilts 14° &amp; expands smoothly on hover</text>

      <rect x="0" y="40" width="6" height="6" fill="#38BDF8"/>
      <text x="14" y="47" font-weight="600" fill="#F8FAFC">Compact Status Color Block</text>
      <text x="14" y="63" font-size="10.5" fill="#94A3B8">Minimal 34×14 indicator while docked</text>

      <rect x="0" y="80" width="6" height="6" fill="#818CF8"/>
      <text x="14" y="87" font-weight="600" fill="#F8FAFC">Fullscreen Hide &amp; Edge Alert</text>
      <text x="14" y="103" font-size="10.5" fill="#94A3B8">Hides in games; peeks on Ready/Error</text>
    </g>
  </g>

  <!-- Bottom 8 Built-in Pixel Pets Row -->
  <g transform="translate(28, 276)">
    <text x="0" y="11" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8">8 BUILT-IN PIXEL PETS · CUSTOM WORKING PROPS · v3 .ZIP PACK IMPORT</text>

    <!-- 8 Compact Character Tiles (width 106 each, gap 8 -> 8*106 + 7*8 = 904) -->
    <!-- 1. CyberFox -->
    <g transform="translate(0, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="2" y="0" width="7" height="6" fill="#0284C7"/>
        <rect x="27" y="0" width="7" height="6" fill="#0284C7"/>
        <rect x="2" y="6" width="32" height="20" fill="#38BDF8"/>
        <rect x="8" y="16" width="20" height="10" fill="#F8FAFC"/>
        <rect x="8" y="10" width="5" height="5" fill="#0F172A"/>
        <rect x="23" y="10" width="5" height="5" fill="#0F172A"/>
        <rect x="6" y="26" width="24" height="10" fill="#0EA5E9"/>
        <rect x="8" y="29" width="20" height="6" fill="#1E293B"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">CyberFox</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7DD3FC">Holo Terminal</text>
    </g>

    <!-- 2. AstroBot -->
    <g transform="translate(114, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#93C5FD" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="16" y="-2" width="4" height="4" fill="#38BDF8"/>
        <rect x="4" y="2" width="28" height="22" fill="#E2E8F0"/>
        <rect x="8" y="7" width="20" height="12" fill="#0F172A"/>
        <rect x="11" y="11" width="5" height="4" fill="#38BDF8"/>
        <rect x="20" y="11" width="5" height="4" fill="#38BDF8"/>
        <rect x="7" y="24" width="22" height="12" fill="#CBD5E1"/>
        <rect x="9" y="28" width="18" height="7" fill="#1E293B"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">AstroBot</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#93C5FD">Star Pad</text>
    </g>

    <!-- 3. ShadowCat -->
    <g transform="translate(228, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#FBBF24" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="3" y="0" width="7" height="6" fill="#1E293B"/>
        <rect x="26" y="0" width="7" height="6" fill="#1E293B"/>
        <rect x="3" y="6" width="30" height="20" fill="#334155"/>
        <rect x="8" y="11" width="6" height="6" fill="#FACC15"/>
        <rect x="22" y="11" width="6" height="6" fill="#FACC15"/>
        <rect x="6" y="26" width="24" height="10" fill="#1E293B"/>
        <rect x="12" y="28" width="12" height="8" rx="3" fill="#EC4899"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">ShadowCat</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#FDE68A">Yarn Ball</text>
    </g>

    <!-- 4. ByteGhost -->
    <g transform="translate(342, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#818CF8" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="4" y="2" width="28" height="28" rx="6" fill="#EEF2FF"/>
        <rect x="9" y="11" width="5" height="6" fill="#4F46E5"/>
        <rect x="22" y="11" width="5" height="6" fill="#4F46E5"/>
        <rect x="11" y="24" width="14" height="11" fill="#6366F1"/>
        <rect x="13" y="24" width="8" height="4" fill="#F8FAFC"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">ByteGhost</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#A5B4FC">3.5" Floppy</text>
    </g>

    <!-- 5. ShibaDog -->
    <g transform="translate(456, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="3" y="0" width="7" height="6" fill="#D97706"/>
        <rect x="26" y="0" width="7" height="6" fill="#D97706"/>
        <rect x="3" y="6" width="30" height="20" fill="#F59E0B"/>
        <rect x="8" y="16" width="20" height="10" fill="#FEF3C7"/>
        <rect x="9" y="11" width="5" height="5" fill="#0F172A"/>
        <rect x="22" y="11" width="5" height="5" fill="#0F172A"/>
        <rect x="6" y="26" width="24" height="10" fill="#D97706"/>
        <rect x="8" y="29" width="20" height="6" fill="#FEF3C7"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">ShibaDog</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#FCD34D">Bone Keyboard</text>
    </g>

    <!-- 6. PixelDragon -->
    <g transform="translate(570, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="5" y="0" width="5" height="6" fill="#FACC15"/>
        <rect x="26" y="0" width="5" height="6" fill="#FACC15"/>
        <rect x="4" y="6" width="28" height="20" fill="#10B981"/>
        <rect x="9" y="11" width="5" height="5" fill="#0F172A"/>
        <rect x="22" y="11" width="5" height="5" fill="#0F172A"/>
        <rect x="7" y="26" width="22" height="10" fill="#059669"/>
        <rect x="14" y="26" width="8" height="10" fill="#6EE7B7"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">PixelDragon</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#6EE7B7">Jade Crystal</text>
    </g>

    <!-- 7. Android Bugdroid -->
    <g transform="translate(684, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#3DDC84" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="8" y="0" width="3" height="5" fill="#3DDC84"/>
        <rect x="25" y="0" width="3" height="5" fill="#3DDC84"/>
        <rect x="4" y="5" width="28" height="13" rx="4" fill="#3DDC84"/>
        <rect x="10" y="10" width="4" height="4" fill="#FFFFFF"/>
        <rect x="22" y="10" width="4" height="4" fill="#FFFFFF"/>
        <rect x="5" y="20" width="26" height="16" fill="#3DDC84"/>
        <rect x="9" y="28" width="14" height="4" fill="#CBD5E1"/>
        <rect x="21" y="26" width="7" height="7" fill="#FACC15"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">Bugdroid</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#3DDC84">Wrench &amp; Gear</text>
    </g>

    <!-- 8. Flutter Dash -->
    <g transform="translate(798, 22)">
      <rect width="106" height="86" rx="4" fill="#111827" stroke="#54C5F8" stroke-width="1.5"/>
      <g transform="translate(35, 12)">
        <rect x="16" y="0" width="4" height="5" fill="#0175C2"/>
        <rect x="4" y="5" width="28" height="29" rx="6" fill="#54C5F8"/>
        <rect x="10" y="19" width="16" height="13" fill="#E0F2FE"/>
        <rect x="9" y="11" width="4" height="4" fill="#0F172A"/>
        <rect x="23" y="11" width="4" height="4" fill="#0F172A"/>
        <rect x="15" y="14" width="6" height="4" fill="#FACC15"/>
        <rect x="10" y="26" width="12" height="8" fill="#0175C2"/>
      </g>
      <text x="53" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC">Flutter Dash</text>
      <text x="53" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#54C5F8">Dart Target</text>
    </g>
  </g>
</svg>
