name: Community Pet Submission
description: Submit a custom pet pack (.zip) — once approved by maintainers, it is automatically published and searchable inside the plugin.
title: "[Pet]: "
labels: ["community-pet"]
body:
  - type: markdown
    attributes:
      value: |
        Submit your custom pixel pet pack in English! After maintainer review (`approved` label), a GitHub Action will automatically validate your `.zip` and preview image, archive them, update `community-pets.json`, and make your pet **instantly searchable & installable** inside Antigravity Pet.

        Before submitting, please make sure your `.zip` follows [`CUSTOM_PET_SPEC.md`](https://github.com/Wlaeg/antigravity-pet/blob/main/CUSTOM_PET_SPEC.md).
  - type: input
    id: pet_id
    attributes:
      label: Pet ID
      description: Lowercase letters, numbers, and hyphens only (`[a-z0-9-_]`). Must match `id` in `pet.json`.
      placeholder: e.g. cyber-shiba
    validations:
      required: true
  - type: input
    id: display_name
    attributes:
      label: Display Name
      placeholder: e.g. CyberShiba
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      placeholder: e.g. Pixel Shiba Inu wearing AR coding glasses
    validations:
      required: true
  - type: input
    id: theme_color
    attributes:
      label: Theme Color (Hex)
      placeholder: "#0EA5E9"
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated keywords for in-plugin search (e.g. `pixel, animal, working-anim, single-image`).
      placeholder: pixel, animal, cyber
    validations:
      required: false
  - type: textarea
    id: preview_url
    attributes:
      label: Pet Full-Body Preview Image (Required)
      description: Required — drag and drop a PNG/WebP/JPG full-body preview image provided by you directly into this box (or paste an HTTPS image URL). Shown directly in the in-plugin Community Workshop before download.
      placeholder: "![preview](https://github.com/user-attachments/assets/...)"
    validations:
      required: true
  - type: textarea
    id: zip_url
    attributes:
      label: Pet Pack .zip File or Direct URL
      description: Drag and drop your `.zip` file directly into this box (GitHub will upload it as a link), or paste a direct HTTPS `.zip` URL.
      placeholder: https://github.com/user-attachments/files/.../my-pet.zip
    validations:
      required: true
  - type: checkboxes
    id: license_check
    attributes:
      label: License Confirmation
      options:
        - label: I confirm I created these assets or have permission to distribute them under the repository's MIT License.
          required: true
