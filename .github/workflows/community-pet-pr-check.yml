name: Validate Community Pet PR

on:
  pull_request:
    paths:
      - 'community/packs/**'
      - 'community-pets.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate community-pets.json and all packs
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const manifest = JSON.parse(fs.readFileSync('community-pets.json', 'utf8'));
            if (!Array.isArray(manifest.pets)) throw new Error('manifest.pets must be an array');
            const seen = new Set();
            for (const pet of manifest.pets) {
              const id = String(pet.id || '').toLowerCase();
              if (!id || seen.has(id)) throw new Error('Duplicate or missing pet id: ' + id);
              seen.add(id);
              const zipPath = path.resolve(pet.localZip || ('community/packs/' + id + '.zip'));
              if (!fs.existsSync(zipPath)) throw new Error('Missing localZip for ' + id + ': ' + zipPath);
              execFileSync('node', ['scripts/validate-pet-pack.mjs', zipPath], { stdio: 'inherit' });
            }
            console.log('Validated', manifest.pets.length, 'community pet packs.');
          "
