name: Sync Community Pet Stats

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'community-pets.json'

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aggregate Issue reactions & Release downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-community-stats.mjs

      - name: Commit updated community-stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-stats.json
          if git diff --staged --quiet; then
            echo "No stats changes"
          else
            git commit -m "chore(community): sync global pet stars & downloads"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 2
            done
          fi
